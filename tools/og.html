<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F1EA; --ink:#1A1917; --ink-2:#4A4941; --ink-3:#67645A;
    --rule:#CFC9BB; --rule-2:#B3AC9B; --rule-3:#DDD8CB; --accent:#B23A1C;
    --serif:'Instrument Serif',Georgia,serif;
    --sans:'Instrument Sans',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    width:1200px;height:630px;overflow:hidden;background:var(--paper);color:var(--ink);
    font-family:var(--sans);position:relative;
    background-image:
      linear-gradient(to right,rgba(26,25,23,.05) 1px,transparent 1px),
      linear-gradient(to bottom,rgba(26,25,23,.05) 1px,transparent 1px);
    background-size:34px 34px;
  }
  body::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 38% -20%,rgba(255,255,255,.92),rgba(255,255,255,0) 60%);
    mix-blend-mode:soft-light;
  }
  .frame{position:absolute;inset:26px;border:1px solid var(--rule);z-index:2}
  .tick{position:absolute;width:20px;height:20px;z-index:3}
  .tick::before,.tick::after{content:"";position:absolute;background:var(--rule-2)}
  .tick::before{width:1px;height:20px;top:0}
  .tick::after{width:20px;height:1px;top:0}
  .tl{left:26px;top:26px}.tr{right:26px;top:26px;transform:rotate(90deg)}
  .bl{left:26px;bottom:26px;transform:rotate(-90deg)}.br{right:26px;bottom:26px;transform:rotate(180deg)}

  /* everything is pinned so the card can never overflow its 1200x630 canvas */
  .top{position:absolute;left:64px;right:64px;top:56px;display:flex;justify-content:space-between;
    align-items:baseline;font-family:var(--mono);font-size:15px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-3);z-index:2}
  .top b{color:var(--ink);font-weight:500}

  .mid{position:absolute;left:64px;bottom:214px;z-index:2}
  h1{font-family:var(--serif);font-size:118px;line-height:.87;letter-spacing:-.02em;font-weight:400}
  h1 em{font-style:italic}
  .hr{height:1px;background:var(--rule);margin:28px 0 18px;width:740px}
  .role{font-family:var(--mono);font-size:18px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink)}
  .role i{font-style:normal;color:var(--accent)}

  .bottom{position:absolute;left:64px;right:64px;bottom:52px;display:flex;justify-content:space-between;
    align-items:flex-end;gap:40px;z-index:2}
  .where{font-family:var(--mono);font-size:15px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--ink-3);line-height:1.9}
  .where b{color:var(--ink);font-weight:500}
  .rack{flex:none;display:block}

  .rbox{stroke:var(--ink);stroke-width:1.4;fill:none}
  .rbox2{stroke:var(--rule-2);stroke-width:1.2;fill:none}
  .racc{stroke:var(--accent);stroke-width:1.4;fill:none}
  .rlab{font-family:var(--mono);font-size:11px;letter-spacing:.1em;fill:var(--ink-3)}
  .rlab2{font-family:var(--mono);font-size:13px;letter-spacing:.09em;fill:var(--ink)}
  .rdim{stroke:var(--rule-2);stroke-width:1;fill:none}
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="tick tl"></div><div class="tick tr"></div>
  <div class="tick bl"></div><div class="tick br"></div>

  <div class="top">
    <span><b>Eamon McKiernan</b> &#183; Site plan</span>
    <span>Sheet 00 &#183; Rev A &#183; 2026</span>
  </div>

  <div class="mid">
    <h1>Eamon<br><em>McKiernan</em></h1>
    <div class="hr"></div>
    <div class="role">IT Support Engineer <i>&#183;</i> Self-Hosted AI Infrastructure</div>
  </div>

  <div class="bottom">
    <div class="where">
      <b>Isle of Man</b><br>
      Open to remote and on-site work
    </div>

    <svg class="rack" width="296" height="156" viewBox="0 0 296 156" xmlns="http://www.w3.org/2000/svg">
      <text class="rlab" x="0" y="10">RACK ELEVATION</text>
      <line x1="0" y1="20" x2="296" y2="20" stroke="#DDD8CB" stroke-width="1"/>

      <!-- chassis -->
      <rect class="rbox" x="0" y="30" width="188" height="106"/>
      <!-- units -->
      <rect class="rbox2" x="11" y="39" width="166" height="22"/>
      <rect class="racc" x="11" y="69" width="166" height="22"/>
      <rect class="rbox2" x="11" y="99" width="166" height="22"/>
      <rect class="rbox2" x="11" y="127" width="166" height="2"/>
      <!-- fans on the accelerator unit -->
      <circle class="racc" cx="28" cy="80" r="6.5"/>
      <circle class="racc" cx="47" cy="80" r="6.5"/>
      <circle class="racc" cx="66" cy="80" r="6.5"/>
      <circle class="racc" cx="85" cy="80" r="6.5"/>
      <line class="racc" x1="102" y1="80" x2="164" y2="80"/>

      <!-- dimension line, clear of the chassis and its label -->
      <text class="rlab" x="0" y="150">2&#215; TESLA V100 32 GB</text>
      <line class="rdim" x1="0" y1="154" x2="188" y2="154"/>
      <line class="rdim" x1="0" y1="149" x2="0" y2="157"/>
      <line class="rdim" x1="188" y1="149" x2="188" y2="157"/>

      <!-- stack key -->
      <text class="rlab2" x="204" y="44">PROXMOX</text>
      <text class="rlab" x="204" y="60">3 NODES</text>
      <text class="rlab2" x="204" y="88">OPNSENSE</text>
      <text class="rlab" x="204" y="104">GATEWAY</text>
      <text class="rlab2" x="204" y="130">262,144</text>
      <text class="rlab" x="204" y="146">CONTEXT</text>
    </svg>
  </div>
</body>
</html>
